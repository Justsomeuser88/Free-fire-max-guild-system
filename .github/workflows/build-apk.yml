name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK to GitHub Releases?'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare Build Files & Keystore
        run: |
          # Generate debug keystore if not present
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Create a placeholder google-services.json if missing to prevent plugin failure
          if [ ! -f "app/google-services.json" ]; then
            echo "Creating dummy google-services.json for build..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "ff-guild-master",
              "storage_bucket": "ff-guild-master.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.ffguild.kxmpzq"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly123456789"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Grant Execute Permission for Gradle
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Prepare APK for Artifact
        run: |
          mkdir -p build-artifacts
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-artifacts/FF-Guild-Master.apk
            echo "APK generated at: $APK_PATH"
          else
            echo "No APK found!" && exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FF-Guild-Master-APK
          path: build-artifacts/FF-Guild-Master.apk
          retention-days: 90

      - name: Create or Update GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('FF Guild Master {0}', github.ref_name) || 'FF Guild Master (Latest APK)' }}
          body: |
            ## 🔥 FF Guild Master — Android APK Download
            
            ### 📱 Direct Download:
            Click **`FF-Guild-Master.apk`** below under **Assets** to download and install the app directly on your Android phone!
            
            - **Build Date**: ${{ github.event.head_commit.timestamp || 'Latest' }}
            - **Commit**: `${{ github.sha }}`
            - **Target Platform**: Android 7.0+ (ARM64 / x86_64)
          draft: false
          prerelease: false
          files: |
            build-artifacts/FF-Guild-Master.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
