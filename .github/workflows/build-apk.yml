name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          
          if [ -z "${JAVA_HOME}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version string: ${JAVA_VER_STRING}"

          if [ -z "${JAVA_VER_STRING}" ]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi

          JAVA_MAJOR=$(echo "${JAVA_VER_STRING}" | awk -F '.' '{print ($1 == "1") ? $2 : $1}')
          echo "Detected Java major version: ${JAVA_MAJOR}"

          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to parse Java major version from string: ${JAVA_VER_STRING}"
            exit 1
          fi

          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "::error::Active Java version (${JAVA_MAJOR}) is lower than required minimum (17)."
            exit 1
          fi

          echo "Java environment verification passed (Java ${JAVA_MAJOR} >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi

          echo "Temporary debug keystore confirmed ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk" -ls || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::Generated APK file is empty: ${EXPECTED_APK}"
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension: ${EXPECTED_APK}"; exit 1 ;;
          esac

          echo "Verified debug APK: ${EXPECTED_APK} ($(stat -c%s "${EXPECTED_APK}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_SANITIZED=$(echo "${REPO_RAW}" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//' | tr '[:upper:]' '[:lower:]')
          if [ -z "${REPO_SANITIZED}" ]; then
            REPO_SANITIZED="android-app"
          fi

          ASSET_NAME="${REPO_SANITIZED}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_DIR="${RUNNER_TEMP}/apk_release_asset_${GITHUB_RUN_NUMBER}_${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${TEMP_DIR}"

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_APK="${TEMP_DIR}/${ASSET_NAME}"

          cp "${SOURCE_APK}" "${TARGET_APK}"

          if [ ! -f "${TARGET_APK}" ] || [ ! -s "${TARGET_APK}" ]; then
            echo "::error::Failed to prepare release asset at ${TARGET_APK}"
            exit 1
          fi

          echo "Prepared release asset: ${TARGET_APK} (${ASSET_NAME})"
          echo "asset_path=${TARGET_APK}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Release asset file is invalid or missing at ${ASSET_PATH}"
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *) echo "::error::Asset path does not have .apk extension: ${ASSET_PATH}"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat << 'EOF'
          ### 📱 Automated Debug APK Build
          
          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: `${{ github.sha }}`
          
          > ⚠️ **Notice**: This APK is intended for testing purposes. It is **not** a Play Store production release and is signed only with a temporary debug keystore.
          
          ### 📥 Download Instructions:
          Download the `.apk` asset attached below directly onto your Android device to install and test.
          EOF
          )

          echo "Creating GitHub Release with tag '${RELEASE_TAG}' and marking as latest..."
          gh release create "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

          echo "GitHub Release creation completed successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "================================================="
            echo " GitHub Release Published Successfully!"
            echo "================================================="
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Asset Filename: ${ASSET_NAME}"
            
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "Direct Release URL: ${RELEASE_URL}"
            
            echo "## 🚀 Debug APK Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **Release Status**: Published successfully to GitHub Releases" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page**: [${RELEASE_TITLE}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag**: \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download APK**: \`${ASSET_NAME}\` (available in the Release Assets section)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact**: The standard Actions artifact \`app-debug-apk\` is also preserved and available for download." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or encountered an issue."
            echo "The APK build succeeded and the GitHub Actions artifact named 'app-debug-apk' remains fully available for download."
            
            echo "## 🚀 Debug APK Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **Release Status**: GitHub Release publishing encountered an issue, but **APK build succeeded**." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact**: \`app-debug-apk\` is ready and available for download from this workflow run." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Note**: You can download \`app-debug-apk\` directly from the Summary/Artifacts section above." >> "$GITHUB_STEP_SUMMARY"
          fi
